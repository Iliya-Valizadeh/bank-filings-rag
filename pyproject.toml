[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Pyflakes plus the pycodestyle error rules (ruff's long-standing default set),
# written out so a newer ruff does not change what CI checks.
select = ["E4", "E7", "E9", "F"]
# E702: a few short statements share a line on purpose (plot setup, dict copies).
ignore = ["E702"]
