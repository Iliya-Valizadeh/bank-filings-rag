[project]
name = "bank-filings-rag"
version = "0.1.0"
description = "Ask a question about RBC's 2024 Annual Report and get an answer back with the page it came from."
readme = "README.md"
license = "MIT"
authors = [{ name = "Iliya Valizadeh" }]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu==1.15.1",
    "rank-bm25==0.2.2",
    "pypdf==6.19.0",
    "pymupdf==1.28.2",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "google-genai==2.25.0",
    "python-dotenv==1.2.3",
    "tqdm==4.70.1",
]

[project.optional-dependencies]
embed = [
    "torch==2.14.0",
    "sentence-transformers==6.1.0",
    "transformers==5.17.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "textstat>=0.7.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_filings_rag"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --cov=bank_filings_rag --cov=eval --cov-report=term-missing --cov-fail-under=47"

[tool.ruff]
line-length = 100
target-version = "py311"
# tools/ is copied from ds-project-standard and checked there. `copier update` replaces it.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
files = ["src", "eval"]

[[tool.mypy.overrides]]
module = ["torch.*", "sentence_transformers.*", "transformers.*", "faiss.*", "rank_bm25.*", "fitz.*"]
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
